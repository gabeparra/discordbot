<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="55%" stop-color="#11162a"/>
      <stop offset="100%" stop-color="#141a33"/>
    </linearGradient>
    <radialGradient id="glow-primary" cx="0.78" cy="0.45" r="0.52">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#5865F2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-mint" cx="0.18" cy="0.88" r="0.45">
      <stop offset="0%" stop-color="#57F287" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#57F287" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b96ff"/>
      <stop offset="55%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#57F287"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#57F287"/>
    </linearGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#glow-primary)"/>
  <rect width="1600" height="480" fill="url(#glow-mint)"/>
  <rect width="1600" height="480" fill="url(#dots)"/>

  <!-- Left typography -->
  <text x="90" y="220" font-family="Montserrat" font-weight="800" font-size="94" letter-spacing="4" fill="url(#wordmark)">DISCORDBOT</text>
  <rect x="92" y="252" width="440" height="4" rx="2" fill="url(#bar)"/>
  <text x="92" y="304" font-family="Montserrat" font-weight="700" font-size="26" letter-spacing="4.5" fill="#f2f3f5">NODE.JS · DISCORD.JS V14 · POSTGRESQL</text>
  <text x="92" y="348" font-family="Montserrat" font-weight="400" font-size="23" fill="#c9d1d9" fill-opacity="0.78">Slash commands, Tenor GIF search, welcome hooks, and daily rewards</text>

  <!-- Right stylized slash-command console panel -->
  <rect x="1030" y="84" width="484" height="312" rx="18" fill="#111524" fill-opacity="0.92" stroke="#5865F2" stroke-opacity="0.45" stroke-width="2"/>
  <!-- Window top bar -->
  <rect x="1030" y="84" width="484" height="42" rx="18" fill="#181e34"/>
  <rect x="1030" y="108" width="484" height="18" fill="#181e34"/>
  <circle cx="1062" cy="105" r="6" fill="#ED4245" fill-opacity="0.85"/>
  <circle cx="1084" cy="105" r="6" fill="#FEE75C" fill-opacity="0.85"/>
  <circle cx="1106" cy="105" r="6" fill="#57F287" fill-opacity="0.85"/>
  <text x="1132" y="111" font-family="JetBrainsMono Nerd Font Mono, DejaVu Sans Mono, monospace" font-weight="600" font-size="16" fill="#949ba4"># general</text>
  <rect x="1428" y="95" width="68" height="20" rx="10" fill="#57F287" fill-opacity="0.16" stroke="#57F287" stroke-opacity="0.6" stroke-width="1"/>
  <circle cx="1442" cy="105" r="4" fill="#57F287"/>
  <text x="1452" y="110" font-family="Montserrat" font-weight="700" font-size="11" fill="#57F287">LIVE</text>

  <!-- Command Row 1: /daily -->
  <rect x="1056" y="146" width="432" height="58" rx="10" fill="#171d32" stroke="#5865F2" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="1070" y="160" width="90" height="30" rx="6" fill="#5865F2"/>
  <text x="1115" y="181" text-anchor="middle" font-family="JetBrainsMono Nerd Font Mono, DejaVu Sans Mono, monospace" font-weight="700" font-size="16" fill="#ffffff">/daily</text>
  <text x="1178" y="173" font-family="Montserrat" font-weight="600" font-size="15" fill="#f2f3f5">+50 coins claimed</text>
  <text x="1178" y="193" font-family="Montserrat" font-weight="400" font-size="13" fill="#949ba4">PostgreSQL row lock · 24h cooldown</text>
  <circle cx="1466" cy="175" r="9" fill="#57F287" fill-opacity="0.2" stroke="#57F287" stroke-width="2"/>
  <polyline points="1461,175 1465,179 1471,171" fill="none" stroke="#57F287" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Command Row 2: /gifsearch -->
  <rect x="1056" y="218" width="432" height="58" rx="10" fill="#171d32" stroke="#2d3654" stroke-width="1.5"/>
  <rect x="1070" y="232" width="128" height="30" rx="6" fill="#2a3357" stroke="#8b96ff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="1134" y="253" text-anchor="middle" font-family="JetBrainsMono Nerd Font Mono, DejaVu Sans Mono, monospace" font-weight="700" font-size="15" fill="#c7ceff">/gifsearch</text>
  <text x="1214" y="245" font-family="Montserrat" font-weight="600" font-size="15" fill="#f2f3f5">Tenor API v2</text>
  <text x="1214" y="265" font-family="Montserrat" font-weight="400" font-size="13" fill="#949ba4">Native fetch · randomized result</text>

  <!-- Command Row 3: /balance, /server, /user, /ping chips -->
  <rect x="1056" y="294" width="110" height="36" rx="8" fill="#171d32" stroke="#57F287" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="1111" y="317" text-anchor="middle" font-family="JetBrainsMono Nerd Font Mono, DejaVu Sans Mono, monospace" font-weight="600" font-size="14" fill="#57F287">/balance</text>

  <rect x="1178" y="294" width="98" height="36" rx="8" fill="#171d32" stroke="#FEE75C" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="1227" y="317" text-anchor="middle" font-family="JetBrainsMono Nerd Font Mono, DejaVu Sans Mono, monospace" font-weight="600" font-size="14" fill="#FEE75C">/server</text>

  <rect x="1288" y="294" width="84" height="36" rx="8" fill="#171d32" stroke="#8b96ff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="1330" y="317" text-anchor="middle" font-family="JetBrainsMono Nerd Font Mono, DejaVu Sans Mono, monospace" font-weight="600" font-size="14" fill="#c7ceff">/user</text>

  <rect x="1384" y="294" width="104" height="36" rx="8" fill="#171d32" stroke="#5865F2" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="1436" y="317" text-anchor="middle" font-family="JetBrainsMono Nerd Font Mono, DejaVu Sans Mono, monospace" font-weight="600" font-size="14" fill="#8b96ff">/ping</text>

  <!-- Subtle bottom status line inside card -->
  <text x="1058" y="365" font-family="JetBrainsMono Nerd Font Mono, DejaVu Sans Mono, monospace" font-size="13" fill="#6e7681">Docker Compose · ESLint 10 · 21 node:test unit tests</text>
</svg>
